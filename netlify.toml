# Netlify configuration for dmaz alyxers
[build]
  publish = "public"
  functions = "netlify/functions"

# Friendly API path -> serverless function
[[redirects]]
  from = "/api/download"
  to = "/.netlify/functions/download"
  status = 200

# YouTube search endpoint
[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

# SPA-style fallback so the homepage always loads
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Cinta Untukmu</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;500;600;700&family=Satisfy&display=swap" rel="stylesheet">
</head>
<body class="result-page">
    <!-- Particles -->
    <div class="particles" id="particles"></div>
    
    <!-- Floating Hearts -->
    <div class="floating-elements" id="floatingElements"></div>

    <div class="container">
        <!-- Envelope Animation -->
        <div id="envelopeScreen" class="envelope-screen">
            <div class="envelope-wrapper">
                <p class="envelope-label">Kamu punya pesan cinta...</p>
                <div class="envelope" id="envelope" onclick="openEnvelope()">
                    <div class="envelope-top"></div>
                    <div class="envelope-body">
                        <div class="envelope-heart">&#128140;</div>
                    </div>
                </div>
                <p class="tap-text">Tap untuk buka</p>
            </div>
        </div>

        <!-- Main Message -->
        <div id="messageScreen" class="message-screen hidden">
            <div class="card glass-card message-card">
                <div class="card-glow"></div>
                
                <!-- Loading State -->
                <div id="loading" class="loading-section">
                    <div class="love-loader">
                        <div class="heart-loading">&#128147;</div>
                    </div>
                    <p class="loading-text">Menulis kata-kata cinta untukmu...</p>
                    <div class="loading-dots">
                        <span>.</span><span>.</span><span>.</span>
                    </div>
                </div>
                
                <!-- Message Content -->
                <div id="messageContainer" class="message-content hidden">
                    <div class="message-header">
                        <div class="sticker-row">
                            <span class="float-sticker">&#128149;</span>
                            <span class="float-sticker">&#127801;</span>
                            <span class="float-sticker">&#128149;</span>
                        </div>
                        <h1 class="message-title">Untukmu, <span id="namaTarget"></span></h1>
                        <div class="separator">
                            <span>&#10045;</span>
                            <div class="line"></div>
                            <span>&#10045;</span>
                        </div>
                    </div>
                    
                    <div class="message-body">
                        <div class="quote-decoration left">&ldquo;</div>
                        <p id="romanticMessage" class="romantic-text"></p>
                        <div class="quote-decoration right">&rdquo;</div>
                    </div>
                    
                    <div class="message-stickers">
                        <span class="sticker-animated">&#128152;</span>
                        <span class="sticker-animated">&#129392;</span>
                        <span class="sticker-animated">&#128144;</span>
                        <span class="sticker-animated">&#128155;</span>
                        <span class="sticker-animated">&#128150;</span>
                    </div>
                    
                    <div class="message-footer">
                        <div class="from-section">
                            <p class="from-label">Dengan segenap cinta,</p>
                            <p class="from-name" id="fromName">Seseorang yang menyayangimu</p>
                        </div>
                        <div class="footer-decoration">
                            <span>&#127801;</span>
                            <span>&#10024;</span>
                            <span>&#128140;</span>
                            <span>&#10024;</span>
                            <span>&#127801;</span>
                        </div>
                    </div>
                </div>
                
                <!-- Error State -->
                <div id="errorContainer" class="error-section hidden">
                    <div class="error-icon">&#128546;</div>
                    <p id="errorMessage">Oops! Gagal memuat pesan cinta.</p>
                    <button class="retry-btn" onclick="location.reload()">
                        &#128260; Coba Lagi
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="result.js"></script>
</body>
</html>
